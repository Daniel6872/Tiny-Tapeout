name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install HDL tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Run butterfly unit tests
        run: |
          cd test
          make butterfly
          ! grep failure results_butterfly.xml

      - name: Synthesize standalone butterfly
        run: |
          yosys -Q -T -p 'read_verilog src/project.v; hierarchy -check -top fft_butterfly; synth -top fft_butterfly; check -assert; stat'

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/results.xml
            test/results_butterfly.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/results_butterfly.xml
            test/output/*
